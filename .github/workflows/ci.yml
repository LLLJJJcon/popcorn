name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      POPCORN_PROVIDER_MODE: fixtures
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web, contracts, and fixture-backed tests
        run: pnpm verify

      - name: Verify the pinned extension release surface
        run: pnpm test:extension

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Apply clean migrations and seed
        run: pnpm db:reset

      - name: Run database pgTAP tests
        run: pnpm db:test

      - name: Export local fixture settings
        shell: bash
        run: |
          pnpm exec supabase status -o env > /tmp/popcorn-supabase.env
          source /tmp/popcorn-supabase.env
          {
            echo "APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "POPCORN_E2E_DATABASE_URL=$DB_URL"
            echo "INTERNAL_JOB_SECRET=fixture-job-secret"
          } >> "$GITHUB_ENV"

      - name: Install fixture browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Package and validate the local extension
        run: |
          pnpm extension:package
          bash scripts/check-extension-release.sh dist/popcorn-extension.zip

      - name: Run the fixture classroom acceptance
        run: pnpm playwright test tests/e2e/demo-acceptance.spec.ts --project=chromium-extension

      - name: Check patch whitespace
        run: git diff --check

      - name: Stop local Supabase
        if: ${{ always() }}
        run: node_modules/.bin/supabase stop --no-backup
